name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build and test
        run: ./scripts/test.sh

      - name: Exercise the real Sparkle upgrade lifecycle
        run: python3 scripts/test-update-integration.py
      - name: Render the update-ready menu icon without opening windows
        run: .build/debug/Nuncid --menu-update-icon-probe .build/menu-update-ready.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: updater-integration-evidence
          include-hidden-files: true
          path: |
            .build/update-*.log
            .build/update-settings.png
            .build/menu-update-ready.png
          if-no-files-found: ignore

      # PR code never receives release-signing secrets. A reviewed exact source
      # commit is sealed separately with the manually dispatched workflow.
      - name: Verify embedded updater and portable app
        run: |
          ./scripts/package-app.sh release
          codesign --verify --deep --strict dist/Nuncid.app
          cd /tmp
          "$GITHUB_WORKSPACE/dist/Nuncid.app/Contents/MacOS/Nuncid" --self-test

      - name: Dry-run the release feed with the public fixture key
        run: python3 scripts/test-update-feed.py

      # Complete strict-concurrency checking is intentionally a Swift 6
      # migration gate. The package remains in Swift 5 language mode for 1.0.
